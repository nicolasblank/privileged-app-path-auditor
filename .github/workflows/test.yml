name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pester:
    name: PowerShell 7 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run repository data safety checks
        shell: pwsh
        run: |
          ./tools/Test-RepositoryDataSafety.ps1 -Mode TrackedTree
          ./tools/Test-RepositoryDataSafety.ps1 -Mode History

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run regression suite
        shell: pwsh
        run: Invoke-Pester -Path ./tests -CI -Output Detailed
